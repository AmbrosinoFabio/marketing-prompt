# Updates the home page news every day and warns when the official prompting
# guides change. Can also be started by hand: Actions → "Update news" → Run workflow.
name: Update news

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC
  workflow_dispatch:

# Actions are pinned to a full commit id (not a movable tag); Dependabot proposes updates.
permissions: {}     # nothing by default; the job below gets only what it needs

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # commit data/news.js
      issues: write     # open a reminder when a watched page changes
    steps:
      # the write token is not left in .git/config while third-party feeds are read;
      # it is passed only to the final push
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Check the prompt library
        run: python tools/valida_prompt.py

      - name: Fetch news and check watched pages
        id: news
        run: python tools/aggiorna_news.py

      - name: Commit if something changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.js data/news.json tools/stato_pagine.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update news ($(date -u +%Y-%m-%d))"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Open a reminder issue when an official guide changed
        if: steps.news.outputs.pagine_cambiate != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGINE: ${{ steps.news.outputs.pagine_cambiate }}
        run: |
          printf 'These official pages changed since the last check:\n\n%s\n\nReview the library prompts and the "Anatomy of a good prompt" section on the home page.\n' "$PAGINE" > corpo.md
          gh issue create --title "Official prompting guide changed ($(date -u +%Y-%m-%d))" --body-file corpo.md
