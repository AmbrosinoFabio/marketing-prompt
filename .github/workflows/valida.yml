# Checks the prompt library on every push and pull request that touches it.
# If a prompt is broken (missing variable, duplicate id, missing translation of an id…)
# the run fails and GitHub shows a red ✗ next to the commit.
# Can also be started by hand: Actions → "Check prompts" → Run workflow.
name: Check prompts

on:
  push:
    paths:
      - "data/prompts.js"
      - "data/prompts-it.js"
      - "data/categorie.js"
      - "tools/valida_prompt.py"
      - ".github/workflows/valida.yml"
  pull_request:
    paths:
      - "data/prompts.js"
      - "data/prompts-it.js"
      - "data/categorie.js"
      - "tools/valida_prompt.py"
      - ".github/workflows/valida.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valida:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Check the prompt library
        run: python tools/valida_prompt.py
